# B2 treatment: identical to the h-only control, adding only pure-gradient
# rate-distortion p-refinement at iteration 10,500.
extends: b2_figure473_48v_h_blend50.yaml

training:
  progressive:
    milestones:
      10500:
        levels: [2]
        active_fraction: 0.02
        operation: p_elevate
        strategy: gradient_rate_distortion
        candidate_fraction: 0.08
        target_degree: [1, 1, 1]
        gradient_batches: 8
        gradient_batch_rays: 8192
        max_added_coefficients: 1000000

output:
  dir: output\b2_figure473_48v_hp_blend50

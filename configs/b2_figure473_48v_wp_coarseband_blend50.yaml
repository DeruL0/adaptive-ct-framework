# Direction A: p-refine coarse L0/L1 leaves with moderate positive residuals,
# rather than the highest-residual L2 boundary leaves. All other B2 settings
# remain matched to the h-only blend50 control.
extends: b2_figure473_48v_h_blend50.yaml

training:
  progressive:
    milestones:
      10500:
        levels: [0, 1]
        active_fraction: 0.02
        operation: p_elevate
        strategy: gradient_rate_distortion
        residual_quantile_range: [0.50, 0.85]
        candidate_fraction: 0.08
        target_degree: [1, 1, 1]
        gradient_batches: 8
        gradient_batch_rays: 8192
        max_added_coefficients: 1000000

output:
  dir: output\b2_figure473_48v_wp_coarseband_blend50

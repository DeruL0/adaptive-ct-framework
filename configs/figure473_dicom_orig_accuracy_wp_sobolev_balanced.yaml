# Balanced edge objective: weaker global gradient-moment calibration and a
# concentrated endpoint intensity anchor on the strongest training edges.
extends: figure473_dicom_orig_accuracy_controlled_wp.yaml

training:
  projection_gradient_loss:
    weight: 0.25
    start_iteration: 6001
    ramp_steps: 1000
    edge_rays: 2048
    strides: [1, 2, 4]
    uniform_fraction: 0.5
    candidate_multiplier: 8
    edge_weight_power: 0.5
    edge_min_weight: 0.25
    edge_max_weight: 4.0
    moment_weight: 10.0
    moment_quantile: 0.75
    endpoint_weight: 1.0
    endpoint_quantile: 0.95

output:
  dir: output\figure473_dicom_orig_accuracy_wp_sobolev_balanced

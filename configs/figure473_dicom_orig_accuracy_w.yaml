device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_convergence

geometry:
  samples_per_ray: 1024

model:
  representation: bernstein_octree
  levels: [96, 192, 384]
  topology: packed_hierarchy
  balance_2to1: true
  max_leaf_count: 7500000
  max_degree: [3, 3, 3]
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  iterations: 15000
  batch_rays: 8192
  lr: 0.015
  tv_weight: 0.0
  log_every: 100
  eval_every: 1000
  eval_test_views: 4
  eval_ray_chunk: 65536
  compute_eval: true

  projection_weighting_schedule:
    1:
      mode: uniform
      epsilon: 1.0e-3
    6001:
      mode: target_power
      target_power: 0.25
      min_weight: 0.3
      max_weight: 2.0

  coefficient_continuity:
    weight: 0.001
    start_iteration: 6001
    ramp_steps: 1000
    max_pairs: 8192
    huber_delta: 0.01
    include_cross_level: true
    face_quadrature_order: 2

  progressive:
    refinement:
      strategy: coefficient
      halo: 0
      residual_split: train
      residual_views: 16
      residual_rays_per_view: 32768
      residual_ray_chunk: 65536
      residual_max_buffer_mb: 512
      gradient_weight: 4.0
    milestones:
      80:
        level: 1
        active_fraction: 0.03
        operation: h_split
        strategy: coefficient
        halo: 0
      180:
        level: 2
        active_fraction: 0.35
        operation: h_split
        strategy: coefficient
        halo: 0
      5000:
        level: 1
        active_fraction: 0.08
        max_fraction: 0.20
        threshold_statistic: q95
        threshold_multiplier: 0.5
        operation: h_split
        strategy: projection_residual
      5600:
        level: 2
        active_fraction: 0.25
        max_fraction: 0.20
        threshold_statistic: q95
        threshold_multiplier: 0.5
        operation: h_split
        strategy: projection_residual
      7600:
        level: 1
        active_fraction: 0.05
        max_fraction: 0.20
        threshold_statistic: q95
        threshold_multiplier: 0.5
        operation: h_split
        strategy: projection_residual
      8200:
        level: 2
        active_fraction: 0.20
        max_fraction: 0.20
        threshold_statistic: q95
        threshold_multiplier: 0.5
        operation: h_split
        strategy: projection_residual

  adaptive:
    enabled: false
    weight_epsilon: 1.0e-3

metrics:
  material_threshold: 0.10
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

output:
  dir: output\figure473_dicom_orig_accuracy_w

export:
  compact_octree:
    enabled: true
    quantization: float16
    topology: auto
  mact:
    enabled: false
  surface:
    enabled: false


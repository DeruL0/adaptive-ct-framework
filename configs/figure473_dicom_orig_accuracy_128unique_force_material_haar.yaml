# P0 + P1 + P4: replace only the L2->L3 residual-energy attribution with
# virtual Haar-detail predicted loss reduction using a diagonal Fisher model.
extends: figure473_dicom_orig_accuracy_128unique_force_material.yaml

training:
  progressive:
    milestones:
      9000:
        level: 3
        active_fraction: 0.10
        max_fraction: 0.10
        threshold_statistic: q95
        threshold_multiplier: 0.5
        balance_reserve_leaves: 300000
        operation: h_split
        strategy: haar_predicted_gain
        haar_ray_chunk: 4096
        fisher_damping: 1.0e-8

output:
  dir: output\figure473_dicom_orig_accuracy_128unique_force_material_haar

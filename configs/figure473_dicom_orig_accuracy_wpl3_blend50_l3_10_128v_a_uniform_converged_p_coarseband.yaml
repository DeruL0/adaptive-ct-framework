# Direction A p-refinement on top of the validated uniform/converged h baseline.
# The only treatment change is the p candidate pool at iteration 10,500:
# coarse L0/L1 leaves with moderate positive projection residuals (q50-q85).
extends: figure473_dicom_orig_accuracy_wpl3_blend50_l3_10_128v_a_uniform_converged.yaml

training:
  progressive:
    milestones:
      10500:
        levels: [0, 1]
        active_fraction: 0.02
        operation: p_elevate
        strategy: gradient_rate_distortion
        residual_quantile_range: [0.50, 0.85]
        candidate_fraction: 0.08
        target_degree: [1, 1, 1]
        gradient_batches: 8
        gradient_batch_rays: 65536
        max_added_coefficients: 1000000

output:
  dir: output\figure473_dicom_orig_accuracy_wpl3_blend50_l3_10_128v_a_uniform_converged_p_coarseband

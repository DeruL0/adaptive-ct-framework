# Joint edge objective: signed derivative location, conditional gradient
# magnitude moment, and absolute intensity anchors at both edge endpoints.
extends: figure473_dicom_orig_accuracy_controlled_wp.yaml

training:
  projection_gradient_loss:
    weight: 0.25
    start_iteration: 6001
    ramp_steps: 1000
    edge_rays: 2048
    strides: [1, 2, 4]
    uniform_fraction: 0.5
    candidate_multiplier: 8
    edge_weight_power: 0.5
    edge_min_weight: 0.25
    edge_max_weight: 4.0
    moment_weight: 20.0
    moment_quantile: 0.75
    endpoint_weight: 0.25
    endpoint_quantile: 0.75

output:
  dir: output\figure473_dicom_orig_accuracy_wp_sobolev_moment_endpoint

extends: industrial_detail_v5_256v_equal_ratio_anisotropic.yaml

# Nodal evaluation companion for the 256-view equal-ratio anisotropic run.
#
# The scanner metadata has sVoxel=[2,2,2], so the physical reconstruction box
# remains cubic.  The non-cubic level shapes preserve equal compression relative
# to the sampled volume shape 473x1024x1024; changing the physical box aspect
# ratio would instead distort the acquisition geometry.
output:
  dir: output\industrial_detail_v5_256v_equal_ratio_anisotropic_nodal

# Fully adaptive h-refinement.  Every eligible leaf across all levels competes
# by the same scale-aware face-jump estimator under a global byte budget.
# No support threshold, minimum resolution, level quota, or forced coverage.
extends: ../figure473_128v_simple.yaml

model:
  levels: [48, 96, 192, 384]
  balance_2to1: false
  max_leaf_count: 6000000

training:
  iterations: 25000

  progressive:
    refinement:
      selection_split: train
      halo: 0

    convergence_milestones:
      - levels: [0, 1, 2]
        operation: h_jump_rd
        max_added_bytes: 8000000
        min_iteration: 1500
        max_iteration: 3000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - levels: [0, 1, 2]
        operation: h_jump_rd
        max_added_bytes: 25000000
        min_iteration: 3000
        min_iterations_after_previous: 1000
        max_iteration: 6000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - levels: [0, 1, 2]
        operation: h_jump_rd
        max_added_bytes: 50000000
        min_iteration: 6000
        min_iterations_after_previous: 1500
        max_iteration: 9000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

    milestones: {}

output:
  dir: output\research_figure473_pure_global_jump_48root_128v_25k

# H-only control for the unified hp study.  Spatial actions are selected by
# one Haar-detail Gauss-Newton estimator and raw compact-byte budgets; there
# are no top fractions, material thresholds, held-out gates, or auxiliary
# regularizers.
extends: ../figure473_128v_simple.yaml

model:
  levels: [48, 96, 192, 384]
  balance_2to1: false
  max_leaf_count: 6000000

training:
  iterations: 25000

  progressive:
    refinement:
      selection_split: train
      residual_views: 16
      residual_rays_per_view: 8192
      residual_ray_chunk: 8192

    convergence_milestones:
      - levels: [0]
        operation: h_gauss_newton_rd
        max_added_bytes: 8000000
        fisher_damping: 1.0e-8
        min_iteration: 1500
        max_iteration: 3000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - levels: [1]
        operation: h_gauss_newton_rd
        max_added_bytes: 25000000
        fisher_damping: 1.0e-8
        min_iteration: 3000
        min_iterations_after_previous: 1000
        max_iteration: 6000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - levels: [2]
        operation: h_gauss_newton_rd
        max_added_bytes: 50000000
        fisher_damping: 1.0e-8
        min_iteration: 6000
        min_iterations_after_previous: 1500
        max_iteration: 9000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

    milestones: {}

output:
  dir: output\research_figure473_48root_128v_h_gn_25k

# Second-object generalisation test of the same pure adaptive rule.
extends: ../figure473_128v_simple.yaml

dataset:
  root: D:\Projects\3.3DGS\SAD-GS\data\external_baselines\r2_local\fandisk_ctgs96_48v

geometry:
  samples_per_ray: 96

model:
  levels: [12, 24, 48, 96]
  balance_2to1: false
  max_leaf_count: 200000

training:
  seed: 20260702
  iterations: 5000
  batch_rays: 8192
  eval_every: 1000
  eval_test_views: 12
  allow_test_during_training: false

  progressive:
    refinement:
      selection_split: train
      halo: 0

    convergence_milestones:
      - levels: [0, 1, 2]
        operation: h_jump_rd
        max_added_bytes: 300000
        min_iteration: 300
        max_iteration: 600
        window: 100
        ema_span: 25
        relative_improvement: 0.003
        max_relative_regression: 0.01

      - levels: [0, 1, 2]
        operation: h_jump_rd
        max_added_bytes: 900000
        min_iteration: 600
        min_iterations_after_previous: 300
        max_iteration: 1400
        window: 100
        ema_span: 25
        relative_improvement: 0.003
        max_relative_regression: 0.01

      - levels: [0, 1, 2]
        operation: h_jump_rd
        max_added_bytes: 6000000
        min_iteration: 1400
        min_iterations_after_previous: 500
        max_iteration: 2400
        window: 100
        ema_span: 25
        relative_improvement: 0.003
        max_relative_regression: 0.01

    milestones: {}

metrics:
  material_threshold: 0.5
  compute_projection_metrics: true
  compute_volume_metrics: true
  compute_boundary_metrics: true

output:
  dir: output\research_fandisk_pure_global_jump_48v

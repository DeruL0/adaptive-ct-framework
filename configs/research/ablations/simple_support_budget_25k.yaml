# Minimal admissible-space pipeline:
#   1) material support is guaranteed a 192^3-equivalent floor;
#   2) the remaining global leaf budget is assigned by one coefficient/interface
#      score;
#   3) optimization uses only the static projection fidelity term.
extends: ../figure473_128v_simple.yaml

model:
  balance_2to1: false
  max_leaf_count: 6000000

training:
  iterations: 25000

  progressive:
    refinement:
      selection_split: train
      halo: 0

    convergence_milestones:
      - level: 1
        operation: h_split
        strategy: coefficient
        active_fraction: 0.0
        min_mu_threshold: 0.10
        max_fraction: 1.0
        halo: 0
        min_iteration: 1500
        max_iteration: 3000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - level: 2
        operation: h_split
        strategy: coefficient
        active_fraction: 1.0
        max_fraction: 1.0
        halo: 0
        min_iteration: 3000
        min_iterations_after_previous: 1000
        max_iteration: 6000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

    milestones: {}

output:
  dir: output\research_figure473_128v_support_budget_25k

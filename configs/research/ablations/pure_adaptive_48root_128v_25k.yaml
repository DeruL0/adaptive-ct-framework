# Pure adaptive-resolution run: no support mask, material threshold, minimum
# active level, forced split, held-out topology selection, or auxiliary loss.
# At each converged stage, the coefficient/interface a-posteriori indicator
# ranks every eligible leaf and the global rate budget determines the cutoff.
extends: ../figure473_128v_simple.yaml

model:
  levels: [48, 96, 192, 384]
  balance_2to1: false
  max_leaf_count: 6000000

training:
  iterations: 25000

  progressive:
    refinement:
      selection_split: train
      halo: 0

    convergence_milestones:
      - level: 1
        operation: h_split
        strategy: coefficient
        active_fraction: 1.0
        max_fraction: 1.0
        max_parent_count: 80808
        halo: 0
        min_iteration: 1500
        max_iteration: 3000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - level: 2
        operation: h_split
        strategy: coefficient
        active_fraction: 1.0
        max_fraction: 1.0
        max_parent_count: 252525
        halo: 0
        min_iteration: 3000
        min_iterations_after_previous: 1000
        max_iteration: 6000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - level: 3
        operation: h_split
        strategy: coefficient
        active_fraction: 1.0
        max_fraction: 1.0
        halo: 0
        min_iteration: 6000
        min_iterations_after_previous: 1500
        max_iteration: 9000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

    milestones: {}

output:
  dir: output\research_figure473_pure_adaptive_48root_128v_25k

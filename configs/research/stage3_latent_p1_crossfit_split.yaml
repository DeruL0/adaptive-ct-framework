# Stage 3 gate: cheap residual proposal, then fit/decision-ray cross-fitted h-split.
device: cuda

research:
  scope: stage3_crossfit_split

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_96v_science

geometry:
  samples_per_ray: 1024

model:
  representation: latent_p1_octree
  levels: [48, 96, 192, 384]
  topology: packed_hierarchy
  balance_2to1: false
  max_leaf_count: 6000000
  latent_dim: 4
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  seed: 20260702
  iterations: 6000
  batch_rays: 65536
  lr: 0.015
  tv_weight: 0.0
  log_every: 100
  eval_every: 1000
  eval_test_views: 16
  eval_ray_chunk: 65536
  compute_eval: true
  allow_test_during_training: false

  projection_weighting_schedule:
    1:
      mode: uniform

  noise_normalization:
    enabled: true
    air_quantile: 0.10
    min_variance: 1.0e-8

  coefficient_continuity:
    weight: 0.0

  projection_gradient_loss:
    weight: 0.0

  volume_loss:
    weight: 0.0

  progressive:
    refinement:
      selection_split: train
      residual_views: 2
      residual_rays_per_view: 8192
      residual_ray_chunk: 4096
      residual_max_buffer_mb: 512

    milestones:
      2500:
        operation: h_split
        level: 1
        strategy: residual
        residual_score_mode: residual_exposure
        active_fraction: 0.02
        max_fraction: 0.02
        threshold_statistic: null
        crossfit_acceptance:
          enabled: true
          ray_count: 8192
          fit_fraction: 0.8
          tune_steps: 30
          tune_batch_rays: 2048
          tune_learning_rate: 0.01
          max_candidates: 64
          rate_lambda: 0.0
          min_gain: 0.0
          compact_quantization: float16

    convergence_milestones: []

  adaptive:
    enabled: false
    rate_lambda: 0.0

metrics:
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

export:
  compact_octree:
    enabled: true
    quantization: float16
    topology: packed_hierarchy
  mact:
    enabled: false
  surface:
    enabled: false

output:
  dir: output\stage3_latent_p1_d4_crossfit_split_figure473_96v

# Compute-matched control (final fine-tune 18000 its so total ~= the P1 run): same estimator, marking, budget and protocol as stage7_dorfler_p1_256v,
# but constant (P0) leaves stored as float16 coefficients.  Isolates the
# representation; the byte budget counts the P0 codec.
extends: stage7_dorfler_p1_256v.yaml

model:
  max_degree: [0, 0, 0]
  initial_leaf_degree: null

training:
  progressive:
    convergence_milestones:
      - enabled: true
        operation: dorfler_h_split
        repeat_until_stopped: true
        min_iteration: 1000
        min_iterations_after_previous: 400
        window: 8
        ema_span: 4
        relative_improvement: 0.002
        max_relative_regression: 0.005
        early_rounds: 4
        early_window: 4
        early_min_after_previous: 200
        final_finetune_iterations: 18000
        theta: 0.5
        estimator_rays: 2097152
        estimator_max_buffer_mb: 512
        min_footprint_px: 1.0
        # 0 = indicator is raw residual energy. The air-quantile sigma^2 (~1.7e-4) exceeds the
        # actual residual MSE (~4e-5..9e-5), so subtracting it would only truncate the tail.
        noise_variance_scale: 0.0
        rollback: true
        max_halvings: 3
        dev_ray_count: 1048576
        diagnostic_rays: 262144
        byte_budget: 8388608
        codec:
          type: p0
          quantization: float16

export:
  codec:
    type: p0
    quantization: float16

output:
  dir: output\stage7_dorfler_p0_longft_256v

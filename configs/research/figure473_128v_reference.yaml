# Locked research reference. This file is intentionally self-contained: paper
# experiments may inherit from it by changing one factor only.
device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_128v_science

geometry:
  samples_per_ray: 1024

model:
  representation: bernstein_octree
  levels: [96, 192, 384, 768]
  topology: packed_hierarchy
  balance_2to1: true
  max_leaf_count: 7500000
  max_degree: [3, 3, 3]
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  seed: 20260702
  iterations: 15000
  batch_rays: 65536
  lr: 0.015
  tv_weight: 0.0
  log_every: 100
  eval_every: 1000
  eval_test_views: 16
  eval_ray_chunk: 65536
  compute_eval: true
  allow_test_during_training: false

  # Legacy reference factor. The uniform ablation removes the second stage.
  projection_weighting_schedule:
    1:
      mode: uniform
      epsilon: 1.0e-4
    6001:
      mode: inverse_target_blend
      target_power: 0.25
      min_weight: 0.3
      max_weight: 2.0
      epsilon: 1.0e-4
      blend_alpha: 0.5

  coefficient_continuity:
    weight: 0.001
    start_iteration: 6001
    ramp_steps: 1000
    max_pairs: 8192
    huber_delta: 0.01
    include_cross_level: true
    face_quadrature_order: 2

  progressive:
    refinement:
      strategy: coefficient
      halo: 0
      selection_split: validation
      residual_views: 16
      residual_rays_per_view: 32768
      residual_ray_chunk: 65536
      residual_max_buffer_mb: 512
      gradient_weight: 4.0

    convergence_milestones:
      - level: 1
        operation: h_split
        strategy: coefficient
        active_fraction: 0.15
        min_mu_threshold: 0.10
        max_fraction: 0.20
        balance_reserve_leaves: 1500000
        halo: 0
        min_iteration: 1500
        max_iteration: 3000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - level: 2
        operation: h_split
        strategy: coefficient
        active_fraction: 0.50
        min_mu_threshold: 0.10
        max_fraction: 0.60
        balance_reserve_leaves: 1500000
        halo: 0
        min_iteration: 3000
        min_iterations_after_previous: 1000
        max_iteration: 6000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

    milestones:
      9000:
        level: 3
        operation: h_split
        strategy: haar_predicted_gain
        active_fraction: 0.10
        max_fraction: 0.10
        threshold_statistic: q95
        threshold_multiplier: 0.5
        balance_reserve_leaves: 300000
        haar_ray_chunk: 4096
        fisher_damping: 1.0e-8

      10500:
        levels: [0, 1]
        operation: p_elevate
        strategy: gradient_rate_distortion
        candidate_fraction: 0.08
        active_fraction: 0.02
        target_degree: [1, 1, 1]
        gradient_batches: 8
        gradient_batch_rays: 65536
        max_added_coefficients: 1000000
        residual_quantile_range: [0.50, 0.85]

  adaptive:
    enabled: false
    weight_epsilon: 0.001

metrics:
  material_threshold: 0.1
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

export:
  compact_octree:
    enabled: true
    quantization: float16
    topology: auto
  mact:
    enabled: false
  surface:
    enabled: false

output:
  dir: output\research_figure473_128v_reference

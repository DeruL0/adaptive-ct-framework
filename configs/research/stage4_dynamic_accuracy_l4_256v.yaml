extends: stage4_ablation_squared_residual_4096.yaml

model:
  levels: [48, 96, 192, 384, 768]

training:
  iterations: 30000

  fixed_decision_rays:
    enabled: true
    use_for_plateau: true
    ray_count: 65536
    interval: 50
    seed: 20260706
    chunk_rays: 65536

  progressive:
    structural_rounds:
      enabled: false

    convergence_milestones:
      - enabled: true
        repeat_until_stopped: true
        min_iteration: 2000
        min_iterations_after_previous: 500
        window: 8
        ema_span: 4
        relative_improvement: 0.002
        max_relative_regression: 0.005
        min_rounds: 4
        max_rounds: 24
        stop_acceptance_ratio: 0.03
        final_finetune_iterations: 1000
        operation: global_h_split
        strategy: residual
        max_split_level: 4
        residual_score_mode: residual_squared_density
        residual_views: 8
        residual_rays_per_view: 8192
        residual_ray_chunk: 4096
        residual_max_buffer_mb: 512
        crossfit_acceptance:
          enabled: true
          acceptance_mode: ranked_batch
          ray_count: 262144
          fit_fraction: 0.8
          tune_steps: 30
          accepted_refit_steps: 30
          tune_batch_rays: 2048
          tune_learning_rate: 0.01
          max_candidates: 4096
          max_splits_per_round: 4096
          min_gain: 0.0
          compact_quantization: float16
          byte_budget: 8388608

output:
  dir: output\stage4_dynamic_accuracy_l4_256v

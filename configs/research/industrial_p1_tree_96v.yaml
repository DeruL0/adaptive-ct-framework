schema: industrial_ct_detail_functional_field_v5
device: cuda

reference:
  config: industrial_p1_tree_96v_h_reference.yaml

compression:
  # Same formal raw-packed budget as the latest 96-view run. The DP may only
  # retain a p1 subtree or replace it with one parent p1 function.
  raw_packed_budget_bytes: 81750000
  p1_only: true
  samples_per_axis: 4
  max_workspace_mb: 2048
  score_ray_chunk: 8192
  score_views: 96
  score_rays_per_view: 32768
  finetune_iterations: 15000
  finetune_batch_rays: 65536
  finetune_lr: 0.015
  eval_ray_chunk: 65536
  quantization: float16

output:
  dir: output\industrial_p1_tree_96v\final

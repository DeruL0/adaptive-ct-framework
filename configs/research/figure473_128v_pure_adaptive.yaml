# Stage 0 baseline: fixed packed octree + direct per-leaf P1 Bernstein.
# No neural decoder, no GT volume, no split/merge, no p/h adaptation.
research:
  scope: stage0_direct_p1

device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_96v_science

geometry:
  samples_per_ray: 1024

model:
  representation: bernstein_octree
  levels: [48, 96, 192, 384]
  topology: packed_hierarchy
  balance_2to1: false
  max_leaf_count: 6000000
  max_degree: [1, 1, 1]
  initial_leaf_degree: [1, 1, 1]
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  seed: 20260702
  iterations: 25000
  batch_rays: 65536
  lr: 0.015
  tv_weight: 0.0
  log_every: 100
  eval_every: 1000
  eval_test_views: 16
  eval_ray_chunk: 65536
  compute_eval: true
  allow_test_during_training: false

  projection_weighting_schedule:
    1:
      mode: uniform

  coefficient_continuity:
    weight: 0.0

  progressive:
    refinement:
      selection_split: train
      halo: 0

    convergence_milestones: []

    milestones: {}

  adaptive:
    enabled: false

metrics:
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

export:
  compact_octree:
    enabled: true
    quantization: float16
    topology: auto
  mact:
    enabled: false
  surface:
    enabled: false

output:
  dir: output\stage0_direct_p1_figure473_96v

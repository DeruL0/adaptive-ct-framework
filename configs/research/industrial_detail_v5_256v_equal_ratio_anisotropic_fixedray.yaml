extends: industrial_detail_v5_256v_equal_ratio_anisotropic.yaml

# Single-variable ablation: stochastic optimization is unchanged, while the
# convergence-triggered h-refinement milestones use one frozen training-ray set
# as their plateau ruler.
training:
  fixed_decision_rays:
    enabled: true
    use_for_plateau: true
    ray_count: 65536
    chunk_rays: 65536
    interval: 1
    seed: 20260702

output:
  dir: output\industrial_detail_v5_256v_equal_ratio_anisotropic_fixedray

# Canonical research pipeline after the 2026-07-02 audit.
# One fidelity term, two spatial refinement rounds, no unsupported auxiliary
# losses or degree refinement, and a final compact export.
device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_128v_science

geometry:
  samples_per_ray: 1024

model:
  representation: bernstein_octree
  levels: [96, 192, 384]
  topology: packed_hierarchy
  balance_2to1: true
  max_leaf_count: 7500000
  max_degree: [1, 1, 1]
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  seed: 20260702
  iterations: 15000
  batch_rays: 65536
  lr: 0.015
  tv_weight: 0.0
  log_every: 100
  eval_every: 1000
  eval_test_views: 16
  eval_ray_chunk: 65536
  compute_eval: true
  allow_test_during_training: false

  projection_weighting_schedule:
    1:
      mode: dynamic_range_balanced
      target_power: 0.25
      min_weight: 0.3
      max_weight: 2.0
      epsilon: 1.0e-4
      blend_alpha: 0.5

  coefficient_continuity:
    weight: 0.0

  progressive:
    refinement:
      selection_split: validation
      halo: 0

    convergence_milestones:
      - level: 1
        operation: h_split
        strategy: coefficient
        active_fraction: 0.15
        min_mu_threshold: 0.10
        max_fraction: 0.20
        balance_reserve_leaves: 1500000
        halo: 0
        min_iteration: 1500
        max_iteration: 3000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - level: 2
        operation: h_split
        strategy: coefficient
        active_fraction: 0.50
        min_mu_threshold: 0.10
        max_fraction: 0.60
        balance_reserve_leaves: 1500000
        halo: 0
        min_iteration: 3000
        min_iterations_after_previous: 1000
        max_iteration: 6000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

    milestones: {}

  adaptive:
    enabled: false

metrics:
  material_threshold: 0.1
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

export:
  compact_octree:
    enabled: true
    quantization: float16
    topology: auto
  mact:
    enabled: false
  surface:
    enabled: false

output:
  dir: output\research_figure473_128v_simple

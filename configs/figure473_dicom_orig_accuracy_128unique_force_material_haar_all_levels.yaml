# Full framework test: use the same virtual Haar/Fisher predicted-gain score
# for every h-refinement stage, while retaining material-support force coverage
# and the exact same 7.5M leaf budget.
extends: figure473_dicom_orig_accuracy_128unique_force_material_haar.yaml

training:
  progressive:
    convergence_milestones:
      - level: 1
        operation: h_split
        strategy: haar_predicted_gain
        active_fraction: 0.15
        min_mu_threshold: 0.10
        max_fraction: 0.20
        balance_reserve_leaves: 1500000
        haar_ray_chunk: 4096
        fisher_damping: 1.0e-8
        halo: 0
        min_iteration: 1500
        max_iteration: 3000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

      - level: 2
        operation: h_split
        strategy: haar_predicted_gain
        active_fraction: 0.50
        min_mu_threshold: 0.10
        max_fraction: 0.60
        balance_reserve_leaves: 1500000
        haar_ray_chunk: 4096
        fisher_damping: 1.0e-8
        halo: 0
        min_iteration: 3000
        min_iterations_after_previous: 1000
        max_iteration: 6000
        window: 200
        ema_span: 50
        relative_improvement: 0.002
        max_relative_regression: 0.005

output:
  dir: output\figure473_dicom_orig_accuracy_128unique_force_material_haar_all_levels

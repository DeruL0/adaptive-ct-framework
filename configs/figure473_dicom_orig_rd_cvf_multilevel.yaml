device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_convergence

geometry:
  samples_per_ray: 1024

model:
  representation: bernstein_octree
  levels: [64, 128, 256]
  max_degree: [0, 0, 0]
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  iterations: 240
  batch_rays: 4096
  lr: 0.018
  tv_weight: 0.0
  log_every: 25
  eval_every: 1000
  eval_test_views: 1
  eval_ray_chunk: 65536
  compute_eval: false
  progressive:
    refinement:
      strategy: coefficient
      halo: 0
    milestones:
      40:
        level: 1
        active_fraction: 0.006
        strategy: coefficient
        halo: 0
      120:
        level: 2
        active_fraction: 0.20
        strategy: coefficient
        halo: 0
  adaptive:
    enabled: false
    weight_epsilon: 1.0e-4

metrics:
  material_threshold: 0.10
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

output:
  dir: output\figure473_dicom_orig_rd_cvf_multilevel

export:
  mact:
    enabled: true
    material_clusters: 4
    variance_retained: 0.99
  surface:
    enabled: false

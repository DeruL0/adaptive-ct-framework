# Control: same pipeline as p1.yaml with constant (P0) leaves stored as float16 values.
extends: p1.yaml

model:
  max_degree: [0, 0, 0]
  initial_leaf_degree: null

training:
  refinement:
    codec:
      type: p0
      quantization: float16

export:
  codec:
    type: p0
    quantization: float16

output:
  dir: output\main_p0_256v

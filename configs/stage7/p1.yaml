# Main pipeline: adaptive octree with constant / trilinear / step leaves, projections only.
#
# Start: 48^3 grid of trilinear leaves, every value = half the mean training projection.
# Each round: solve the fixed tree (nonnegative least squares on the physical coefficients), then
# for every leaf refit the options keep / constant / trilinear / step / split on half of the sampled
# rays, score them on the other half, and take the best batch under "gain - price x bytes" within
# the byte budget. When nothing is worth doing: a final strict solve, then everything stored in fp16.
# Views: train 240 / held-out 16 (reported per round, used for no decision) / test 4 (final
# evaluation only). The GT volume is loaded only for the final volume metrics.
device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_256v_science
  dev_views: 16
  dev_seed: 20260702

model:
  levels: [48, 96, 192, 384, 768]
  max_leaf_count: 6000000
  leaf_types: [constant, trilinear, step]
  cuda_integrator: true
  attenuation_shift: -3.0

training:
  seed: 20260702
  eval_ray_chunk: 1048576
  solver:
    groups: 24              # views split into 24 angle-interleaved groups
    first_group_passes: 4   # grouped passes on the first round (cold start)
    group_passes: 2         # grouped passes on later rounds (warm start)
    round_tol: 1.0e-3       # stop a round's solve at this optimality residual ...
    round_passes: 30        # ... or after this many full-data-equivalent passes (flagged "not converged")
    final_tol: 1.0e-4       # strict solve on the final tree
    final_passes: 150
    min_leaf_px: 2.5        # bin the detector 2x2 / 4x4 while the finest leaf spans >= this many binned pixels
    extrapolate: true
  refinement:
    action_share: 0.5       # each round: best actions until they carry half the total net benefit
    estimator_rays: 4194304 # sampled rays for the refit decision (split in two halves)
    min_footprint_px: 1.0   # children must span >= 1 detector pixel
    byte_budget: 8388608
    max_rounds: 32
    quantization: float16   # bytes counted for what is stored: constant 5, trilinear 19, step 15 per leaf

metrics:
  compute_projection_metrics: true
  compute_volume_metrics: true
  compute_boundary_metrics: false

export:
  compact_octree:
    enabled: true
    artifact_name: ANVO.npz
    quantization: float16

output:
  dir: output\main_p1_256v

# Main pipeline: trilinear (P1) Bernstein octree, projections only.
#
# Each round: solve the fixed tree to convergence (nonnegative least squares on the
# physical coefficients), score leaves on the solved model, split the best batch
# (function preserving). When the byte budget is spent: a final strict solve, then
# export. Views: train 240 / held-out 16 (reported per round, used for no decision) /
# 4 test views (final evaluation only). No FDK, no reference volume; the GT volume is
# loaded only for the final volume metrics.
device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_256v_science
  dev_views: 16
  dev_seed: 20260702

geometry:
  samples_per_ray: 1024

model:
  representation: bernstein_octree
  levels: [48, 96, 192, 384, 768]
  topology: packed_hierarchy
  max_leaf_count: 6000000
  max_degree: [1, 1, 1]
  initial_leaf_degree: [1, 1, 1]
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  seed: 20260702
  eval_ray_chunk: 65536
  allow_test_during_training: false
  projection_weighting_schedule:
    1:
      mode: uniform
  solver:
    groups: 24              # views split into 24 angle-interleaved groups
    first_group_passes: 4   # grouped passes on the first round (cold start)
    group_passes: 2         # grouped passes on later rounds (warm start)
    round_passes: 20        # full-data-equivalent passes per round
    final_passes: 80        # strict solve on the final tree
    extrapolate: true
  refinement:
    gain_share: 0.5         # each batch: best-scored leaves until they carry half the total score
    estimator_rays: 2097152
    estimator_max_buffer_mb: 512
    min_footprint_px: 1.0
    byte_budget: 8388608
    max_rounds: 32
    codec:
      type: latent_p1
      latent_dim: 4
      quantization: float16

metrics:
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

export:
  codec:
    type: latent_p1
    latent_dim: 4
    quantization: float16
    finetune_iterations: 2000
    finetune_lr: 0.003
    finetune_batch_rays: 65536
  compact_octree:
    enabled: true
    artifact_name: ANVO.npz
    quantization: float16
    topology: packed_hierarchy

output:
  dir: output\main_p1_256v

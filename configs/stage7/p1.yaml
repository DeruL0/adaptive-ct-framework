# Main pipeline: adaptive octree with constant / trilinear / step leaves, projections only.
#
# Start: 48^3 grid of trilinear leaves, every value = half the mean training projection.
# Each round: solve the fixed tree (nonnegative least squares on the physical coefficients), then
# for every leaf refit the options keep / constant / trilinear / step / split on half of the sampled
# rays, score them on the other half, and take the best batch under "gain - price x bytes" within
# the byte budget. When nothing is worth doing: a final strict solve, then everything stored in fp16.
# Views: train 240 / held-out 16 (reported per round, used for no decision) / test 4 (final
# evaluation only). The GT volume is loaded only for the final volume metrics.
device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_256v_science
  dev_views: 16
  dev_seed: 20260702

model:
  levels: [48, 96, 192, 384, 768]
  max_leaf_count: 6000000
  leaf_types: [constant, trilinear, step]
  cuda_integrator: true

training:
  seed: 20260702
  max_seconds: 7200         # time limit of the whole run: the model is kept, its status says "time_limit_not_converged"
  eval_ray_chunk: 1048576
  solver:
    subsets: 12             # relaxed OS-LALM: views in 12 angle-interleaved subsets (10-12 in the paper; 24 ripples)
    round_tol: 5.0e-3       # a round's solve has converged when its objective fell by <= this (relative) in the last epoch ...
    round_epochs: 12        # ... at most this many epochs per call (the solve is continued until it has converged)
    final_tol: 1.0e-3       # the final tree: stricter
    final_epochs: 40
    min_epochs: 3           # no convergence is declared before this many epochs on a tree
    min_leaf_px: 2.5        # bin the detector 2x2 / 4x4 while the finest leaf spans >= this many binned pixels
    geometry_steps: 1       # Gauss-Newton steps on the step geometry (n, d, w) per round, before the value solve
    edge_penalty:           # sum over faces of area h phi(jump / h), h = distance of the leaf centres, phi Huber: gradients <= delta quadratic, steeper linear
      weight: 9             # smooth part (beta): 7-9 keep cracks visible; 13-18 best volume PSNR but blur them (sweep at d10f82e)
      delta: 1.5            # gradient (value per box unit); edge pull beta * delta 13.5: 6.5 leaves bright specks, 26+ fades cracks (visual choice sc_d15_b9)
  refinement:
    action_share: 0.35      # each round's net added bytes stay within this share of the remaining budget (0.7 / 0.5 / 0.35: 37.33 / 37.39 / 37.41 dB)
    stop_below_remaining: 0.01  # stop refining when less than this share of the budget is left
    decision_views: 240     # all pixels of all training views; alternate views (by angle) = the two halves
    min_footprint_px: 1.0   # children must span >= 1 detector pixel
    continuation_share: 0.4 # share of each round's allowance for children of gain splits whose own positive split gain did not pay (structure thinner than the children)
    error_share: 0.4        # share of each round's allowance split in decreasing face-jump energy (Binev-DeVore ancestor modification), positive split gain required
    spend_all_below: 0.10   # once less than this share of the budget is left, one decision spends all of it (0: off)
    byte_budget: 8388608    # bytes of the stored file (codec/budget.py): per leaf 2-bit type + its values at its block's width (+ 4 B step geometry)
    max_rounds: 32

codec:
  value_tolerance: 0.001   # stored values on the grid k 0.002, per root cell a base code and a bit width (planes offline: 1.82x smaller file, -0.005 dB)

metrics:
  compute_projection_metrics: true
  compute_volume_metrics: true
  compute_boundary_metrics: false

output:
  dir: output\main_p1_256v

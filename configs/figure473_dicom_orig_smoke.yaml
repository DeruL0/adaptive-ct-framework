device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_smoke

geometry:
  samples_per_ray: 1024

model:
  representation: dynamic_leaf_voxel
  levels: [64, 128, 256]
  init_std: 0.001
  attenuation_shift: -3.0

training:
  iterations: 10
  batch_rays: 512
  lr: 0.015
  tv_weight: 0.0
  log_every: 1
  eval_every: 1000
  eval_test_views: 1
  eval_ray_chunk: 256
  compute_eval: false
  progressive:
    refinement:
      strategy: gradient
      halo: 1
    milestones:
      5:
        level: 1
        active_fraction: 0.005
        strategy: gradient

metrics:
  material_threshold: 0.10
  compute_projection_metrics: false
  compute_volume_metrics: false
  compute_boundary_metrics: false

output:
  dir: output\figure473_dicom_orig_smoke_train

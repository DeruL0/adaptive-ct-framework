device: cuda

dataset:
  root: D:\Projects\7.CT Framework\output\figure473_dicom_orig_r2_convergence

geometry:
  samples_per_ray: 1024

model:
  representation: bernstein_octree
  levels: [64, 128, 256]
  max_degree: [3, 3, 3]
  integration_mode: exact
  cuda_integrator: true
  initialization: projection_mean
  init_std: 0.001
  attenuation_shift: -3.0

training:
  iterations: 5000
  batch_rays: 8192
  lr: 0.015
  tv_weight: 0.0
  log_every: 100
  eval_every: 500
  eval_test_views: 2
  eval_ray_chunk: 65536
  compute_eval: true
  progressive:
    refinement:
      strategy: coefficient
      halo: 0
    milestones:
      80:
        level: 1
        active_fraction: 0.02
        strategy: coefficient
        halo: 0
      220:
        level: 2
        active_fraction: 0.25
        strategy: coefficient
        halo: 0
  adaptive:
    enabled: false
    rounds: 6
    start_iteration: 600
    stop_iteration: 3500
    validation_fraction: 0.25
    variation_threshold: 0.0005
    material_jump_threshold: 0.02
    p_ratio_threshold: 0.25
    max_candidates: 12
    max_reverse_candidates: 0
    pre_tune_steps: 3
    pre_tune_batch_rays: 1024
    pre_tune_learning_rate: 0.005
    tune_steps: 10
    tune_batch_rays: 1024
    tune_learning_rate: 0.004
    validation_ray_chunk: 2048
    validation_views: 1
    validation_rays_per_view: 8192
    rate_lambda: 0.0
    merge_lambda: 0.0
    weight_epsilon: 1.0e-4
    seed: 473

metrics:
  material_threshold: 0.10
  compute_projection_metrics: true
  compute_volume_metrics: false
  compute_boundary_metrics: false

output:
  dir: output\figure473_dicom_orig_rd_cvf_convergence

export:
  mact:
    enabled: true
    material_clusters: 4
    variance_retained: 0.99
  surface:
    enabled: true
    threshold: 0.10
    uncertainty_rays: 64
    uncertainty_surface_points: 1024
